# Netlify: connect the GitHub repo and every push to main redeploys automatically.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Cache the big pose-AI model files for a long time (they never change)
[[headers]]
  for = "/mediapipe-pose/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
